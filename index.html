<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>진짜를 가려라</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen booth kiosk. Top bar + a single active view; document-examiner look (security-print paper, ink teal, stamp red). */
:root{
  --paper:#F2F6F5; --surface:#FFFFFF; --ink:#13262B; --muted:#5A6D71; --line:#D2DDDB;
  --teal:#0E6B66; --teal-ink:#FFFFFF; --stamp:#C2362B; --amber:#A86A12; --ok:#2C7A4B;
  --tint:#E3EEEC;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1719; --surface:#152326; --ink:#E3EDEB; --muted:#94A7A9; --line:#27393C;
  --teal:#3DB5AB; --teal-ink:#06201E; --stamp:#F06A5E; --amber:#E2A548; --ok:#5DC48B; --tint:#1A2C2F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1719; --surface:#152326; --ink:#E3EDEB; --muted:#94A7A9; --line:#27393C;
  --teal:#3DB5AB; --teal-ink:#06201E; --stamp:#F06A5E; --amber:#E2A548; --ok:#5DC48B; --tint:#1A2C2F; color-scheme:dark}

html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.app{min-height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font-family:var(--f-display);font-size:22px;letter-spacing:.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.nav button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.nav button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.notice{font-size:13px;padding:8px 16px;background:var(--tint);color:var(--muted);text-align:center}
main{flex:1;display:flex;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{width:100%;max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:20px;min-width:0}
h1,h2{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(34px,5.4vw,60px)}
h2{font-size:clamp(24px,3vw,32px)}
p{margin:0}
.lead{font-size:clamp(17px,2vw,21px);color:var(--muted);max-width:40em}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.btn{border:0;border-radius:10px;padding:14px 22px;font-weight:700;font-size:17px;cursor:pointer;background:var(--teal);color:var(--teal-ink);min-height:52px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 14px;min-height:0;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* start */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:32px;align-items:center}
.hero .stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.fan{position:relative;aspect-ratio:1.25;max-width:100%}
.fan img{position:absolute;width:72%;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.fan img:nth-child(1){left:0;top:4%;transform:rotate(-8deg)}
.fan img:nth-child(2){left:14%;top:18%;transform:rotate(-1deg)}
.fan img:nth-child(3){left:28%;top:32%;transform:rotate(6deg)}
.steps{display:flex;gap:10px;flex-wrap:wrap;list-style:none;padding:0;margin:0;counter-reset:s}
.steps li{counter-increment:s;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.steps li::before{content:counter(s);font-family:var(--f-mono);width:22px;height:22px;border-radius:50%;border:1px solid var(--line);display:inline-grid;place-items:center;font-size:12px;color:var(--ink)}

/* form */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 18px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
label{font-size:14px;font-weight:500}
.req::after{content:" *";color:var(--stamp)}
input[type=text],input[type=tel],input[type=email],select,textarea{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--paper);width:100%;min-height:48px}
textarea{min-height:80px;resize:vertical}
.consent{font-size:13px;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px;white-space:pre-wrap;max-height:140px;overflow:auto}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--teal)}
.err{color:var(--stamp);font-size:14px;min-height:1.4em}

/* play */
.playgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:28px;align-items:start}
.cardframe{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cardframe img{width:100%;border-radius:10px;display:block;background:var(--tint)}
.meta{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pips{display:flex;gap:6px}
.pip{width:28px;height:6px;border-radius:3px;background:var(--line)}
.pip.on{background:var(--ink)}
.pip.right{background:var(--ok)} .pip.wrong{background:var(--stamp)}
.choices{display:flex;flex-direction:column;gap:12px}
.choice{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:16px 18px;border-radius:12px;border:2px solid var(--line);background:var(--surface);cursor:pointer;min-height:76px}
.choice b{font-family:var(--f-display);font-weight:400;font-size:26px}
.choice span{font-size:14px;color:var(--muted)}
.choice[data-k="원본"] b{color:var(--ok)} .choice[data-k="사본"] b{color:var(--amber)} .choice[data-k="위조"] b{color:var(--stamp)}
.choice:hover{border-color:var(--ink)}
.verdict{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.stamp{align-self:flex-start;font-family:var(--f-display);font-size:30px;padding:4px 16px;border:3px solid currentColor;border-radius:8px;transform:rotate(-3deg)}
.stamp.right{color:var(--ok)} .stamp.wrong{color:var(--stamp)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:700}
.aisee{border:1px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.aisee .tag{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:var(--teal)}
.aisee img{width:100%;border-radius:8px}
.aisee .ph{font-size:14px;color:var(--muted);padding:18px;text-align:center;background:var(--tint);border-radius:8px}

/* result */
.result{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.score{background:var(--ink);color:var(--paper);border-radius:16px;padding:28px;display:flex;flex-direction:column;gap:10px}
.score .num{font-family:var(--f-display);font-size:96px;line-height:1;font-variant-numeric:tabular-nums}
.score .num small{font-size:36px;opacity:.6}
.tier{font-family:var(--f-display);font-size:30px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}

.codeline{display:flex;gap:12px;align-items:baseline;font-size:15px;opacity:.85}
.codeline b{font-family:var(--f-mono);font-size:30px;letter-spacing:.18em;opacity:1}
.clock{font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums;opacity:.75}
/* board */
.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.board th{text-align:left;font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line)}
.board td{padding:12px 10px;border-bottom:1px solid var(--line);font-size:18px}
.board td.rank{font-family:var(--f-display);font-size:26px;width:64px}
.board tr:nth-child(1) td.rank{color:var(--teal)}
.board td.mono{font-family:var(--f-mono);font-size:15px;color:var(--muted)}
.empty{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 14px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* admin */
.cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.cfgcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.cfgcard img{width:100%;border-radius:8px;background:var(--tint)}
.cfgcard .thumbs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cfgcard .thumbs div{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.file{font-size:13px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.leads{border-collapse:collapse;min-width:1100px;width:100%;font-size:14px}
.leads th,.leads td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.leads th{font-size:12px;color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--surface)}
.leads td.n{font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.leads select{min-height:0;padding:4px 6px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface);min-width:120px}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted)}
.tabs{display:flex;gap:6px}

@media (max-width:760px){
  .hero,.playgrid,.result{grid-template-columns:1fr}
  .form{grid-template-columns:1fr}
  .fan{max-width:360px}
  .score .num{font-size:72px}
}
@media (prefers-reduced-motion:no-preference){
  .view{animation:in .25s ease-out}
  @keyframes in{from{transform:translateY(6px)}to{transform:none}}
  .stamp{animation:stampin .3s ease-out}
  @keyframes stampin{from{transform:rotate(-3deg) scale(1.25)}to{transform:rotate(-3deg) scale(1)}}
}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">aiSee 감식단 <small>Fintech Week 2026</small></div>
    <nav class="nav" aria-label="화면">
      <button id="nav-play" data-go="start">체험</button>
      <button id="nav-board" data-go="board" hidden>리더보드</button>
      <button id="nav-mreg" data-go="mreg" hidden>휴대폰 참가자 등록</button>
      <button id="nav-admin" data-go="admin" hidden>관리</button>
    </nav>
  </header>
  <div class="notice" id="notice" hidden></div>
  <main><div class="view" id="view"></div></main>
</div>

<script>
(() => {
"use strict";
/* ---------- defaults ---------- */
const KINDS = {"원본":"정식 발급된 진짜 신분증","사본":"화면 재촬영·인쇄 등으로 복제한 이미지","위조":"사진이나 정보를 바꿔 만든 가짜"};
const DEFAULT_CARDS = [
  {variant:"original", answer:"원본", subtype:"원본", hint:"인쇄 패턴과 홀로그램 영역이 고르게 보이고, 사진과 글자 정렬이 자연스럽습니다."},
  {variant:"recapture", answer:"사본", subtype:"화면 재촬영", hint:"모니터 화면을 다시 찍으면 화면 격자 때문에 물결무늬(모아레)와 빛 반사가 생기기 쉽습니다."},
  {variant:"photoswap", answer:"위조", subtype:"사진 교체", hint:"사진 영역의 테두리와 배경색이 주변 인쇄와 어긋나 있습니다."},
  {variant:"printcopy", answer:"사본", subtype:"인쇄 사본", hint:"종이에 출력한 사본은 색이 바래고, 홀로그램 같은 광학 요소가 사라집니다."},
  {variant:"tamper", answer:"위조", subtype:"정보 변조", hint:"번호 중 한 글자의 글꼴과 높이가 다른 글자와 다릅니다."}
];
const DEFAULT_CONSENT = "[수집 항목] 이름, 소속, 직무, 업종, 연락처, 이메일\n[수집 목적] 이벤트 운영, 경품 지급, 제품 상담 연락\n[보유 기간] 행사 종료 후 ○개월 (법무 확인 후 확정)\n동의를 거부할 수 있으며, 거부 시 이벤트 참여와 경품 수령이 어렵습니다.";
const DEFAULT_PRIZES = {perfect:"커피 모바일 교환권 + 리더보드 등재", great:"무선 충전기 또는 텀블러", basic:"브랜드 카드지갑 또는 루페 키링"};
const DEFAULT_SUBTYPES = {"사본":["화면 재촬영","인쇄 사본"], "위조":["사진 교체","정보 변조"]};
const INDUSTRIES = ["은행","카드","증권","보험","핀테크","공공기관","통신","기타"];

/* ---------- sample card art (fictional, placeholder) ---------- */
const NAMES = {original:"김가상", recapture:"이체험", photoswap:"박샘플", printcopy:"최데모", tamper:"정예시"};
function rosette(cx, cy, r, n, amp){
  let d = "";
  for (let i=0;i<=720;i++){ const t=i/720*Math.PI*2; const rr=r+amp*Math.sin(n*t); d += (i?"L":"M")+(cx+rr*Math.cos(t)).toFixed(1)+" "+(cy+rr*Math.sin(t)).toFixed(1); }
  return d;
}
function cardSVG(variant){
  const name = NAMES[variant] || "김가상";
  const gray = variant==="printcopy";
  const holo = variant==="original" || variant==="tamper" || variant==="photoswap";
  let guil = "";
  for (let k=0;k<6;k++) guil += `<path d="${rosette(640,250,120+k*14,9+k,10)}" fill="none" stroke="#0E6B66" stroke-opacity=".22" stroke-width="1"/>`;
  const photoBg = variant==="photoswap" ? "#E9D9C3" : "#D6E4E2";
  const photoOff = variant==="photoswap" ? 7 : 0;
  const num = variant==="tamper"
    ? `<tspan>DEMO-2026-04</tspan><tspan font-family="Georgia,serif" font-weight="700" dy="-3">8</tspan><tspan dy="3">1</tspan>`
    : `<tspan>DEMO-2026-0481</tspan>`;
  let card = `
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4FAF8"/><stop offset="1" stop-color="#DCEBE8"/></linearGradient>
    <radialGradient id="ho" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#F7D9FF" stop-opacity=".9"/><stop offset=".45" stop-color="#C5F1FF" stop-opacity=".7"/><stop offset=".8" stop-color="#FFF2B8" stop-opacity=".55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
    <filter id="g"><feColorMatrix type="saturate" values="0.08"/><feComponentTransfer><feFuncR type="linear" slope=".9" intercept=".07"/><feFuncG type="linear" slope=".9" intercept=".07"/><feFuncB type="linear" slope=".9" intercept=".06"/></feComponentTransfer></filter>
    <filter id="nz"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="3"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .3  0 0 0 0 .3  0 0 0 .18 0"/></filter>
    <pattern id="moire" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(12)"><rect width="7" height="3.2" fill="#3a6b8a" fill-opacity=".16"/></pattern>
    <pattern id="moire2" width="6.4" height="6.4" patternUnits="userSpaceOnUse" patternTransform="rotate(-4)"><rect width="6.4" height="2.8" fill="#8a3a6b" fill-opacity=".10"/></pattern>
    <clipPath id="cc"><rect x="0" y="0" width="856" height="540" rx="34"/></clipPath>
  </defs>
  <g clip-path="url(#cc)">
    <rect width="856" height="540" fill="url(#bg)"/>
    ${guil}
    <rect x="0" y="0" width="856" height="78" fill="#0E6B66"/>
    <text x="40" y="51" font-family="IBM Plex Sans KR,Malgun Gothic,sans-serif" font-size="30" font-weight="700" fill="#fff">체험용 샘플 신분증</text>
    <text x="816" y="49" text-anchor="end" font-family="IBM Plex Mono,monospace" font-size="18" fill="#CFEDEA">DEMO ONLY</text>
    <rect x="${44+photoOff}" y="${112+photoOff}" width="210" height="270" rx="10" fill="${photoBg}" stroke="${variant==="photoswap"?"#A88C66":"#9DB9B5"}" stroke-width="${variant==="photoswap"?3:1.5}"/>
    <circle cx="${149+photoOff}" cy="${215+photoOff}" r="52" fill="${variant==="photoswap"?"#8B6F55":"#6F8F8B"}"/>
    <path d="M${69+photoOff} ${382+photoOff} q80 -120 160 0 z" fill="${variant==="photoswap"?"#8B6F55":"#6F8F8B"}"/>
    <g font-family="IBM Plex Sans KR,Malgun Gothic,sans-serif" fill="#13262B">
      <text x="300" y="150" font-size="20" fill="#5A6D71">성명</text>
      <text x="300" y="192" font-size="40" font-weight="700">${name}</text>
      <text x="300" y="246" font-size="20" fill="#5A6D71">번호</text>
      <text x="300" y="284" font-size="32" font-family="IBM Plex Mono,monospace">${num}</text>
      <text x="300" y="338" font-size="20" fill="#5A6D71">발급</text>
      <text x="300" y="372" font-size="26">2026. 11. 01 · 컴트루 체험 부스</text>
    </g>
    ${holo?`<ellipse cx="720" cy="430" rx="92" ry="62" fill="url(#ho)"/><ellipse cx="720" cy="430" rx="92" ry="62" fill="none" stroke="#9DB9B5" stroke-dasharray="4 5"/>`:""}
    <text x="40" y="500" font-family="IBM Plex Mono,monospace" font-size="16" fill="#5A6D71">AISEE-BOOTH-SPECIMEN · NOT A VALID ID</text>
    <text x="428" y="330" text-anchor="middle" transform="rotate(-18 428 300)" font-family="Black Han Sans,IBM Plex Sans KR,sans-serif" font-size="150" fill="#C2362B" fill-opacity=".14" letter-spacing="10">SAMPLE</text>
  </g>`;
  if (gray) card = `<g filter="url(#g)">${card}</g><rect width="856" height="540" rx="34" filter="url(#nz)"/>`;
  let svg;
  if (variant==="recapture"){
    svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680">
      <rect width="1000" height="680" fill="#1d2326"/>
      <rect x="22" y="22" width="956" height="636" rx="14" fill="#0c1012"/>
      <g transform="translate(78 62) rotate(-2.5 428 270)">${card}</g>
      <rect x="22" y="22" width="956" height="636" fill="url(#moire)"/>

async function exportXLSX(){

    "리드 등급":l.grade||"", "마케팅 수신 동의":l.consentMarketing?"Y":"N", "스태프 메모":l.staffNote||"", "답안":(l.answers||[]).join(" | ")
  }));
  const btn = document.getElementById("xlsx-btn"); const label = btn ? btn.textContent : "";
  try{

    if (btn){ btn.disabled=true; btn.textContent="파일 만드는 중…"; }
    const ws = XLSX.utils.json_to_sheet(rows, {header:["등록시각","전체순위","이름","닉네임","직업·직무","이메일","휴대폰","소속","업종","점수","만점","소요(초)","경품 등급","경품 지급","상담 신청","관심 내용","리드 등급","마케팅 수신 동의","스태프 메모","답안"]});

  db.collection("leads").orderBy("createdAt","desc").limit(1000).onSnapshot(snap=>{
    if (!snap.metadata.fromCache){ clearTimeout(timer); notice(""); }
    S.leads = snap.docs.map(d=>({id:d.id, ...d.data()})); S.leadsLoaded=true;
    if (S.view==="board" || (S.view==="admin" && S.adminTab==="leads" && !document.activeElement.closest(".leads"))) render();
  }, e=>{ clearTimeout(timer); S.leadsLoaded=true; if (e.code!=="revoked") notice("참여 기록을 불러오지 못했습니다. 이 기기 계정에 편집 권한이 있는지 확인해 주세요."); render(); });
})();
})();
</script>
